<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rector Elementary — Schedules</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B7FD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rector">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F5F3; --paper: #FFFFFF; --ink: #1F2B33; --ink-soft: #5A6870;
    --line: #D9E0DC; --line-strong: #B9C4BE; --focus: #1F2B33; --danger: #B4432F;
    --gK: #D9A62B; --g1: #D96B4A; --g2: #3B7FD1; --g3: #4C9A5B; --g4: #8460C4; --g5: #C9528C; --g6: #2A9393;
    --grade: var(--g2);
    --grade-soft: color-mix(in srgb, var(--grade) 14%, white);
    --grade-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141A1D; --paper: #1D2428; --ink: #EEF2F0; --ink-soft: #A6B2AC;
      --line: #2E383D; --line-strong: #46535A; --focus: #EEF2F0; --danger: #E3735D;
      --grade-soft: color-mix(in srgb, var(--grade) 22%, #1D2428);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141A1D; --paper: #1D2428; --ink: #EEF2F0; --ink-soft: #A6B2AC;
    --line: #2E383D; --line-strong: #46535A; --focus: #EEF2F0; --danger: #E3735D;
    --grade-soft: color-mix(in srgb, var(--grade) 22%, #1D2428);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  img { max-width: 100%; }

  /* ---- Countdown bar (the memorable thing) ---- */
  .now {
    position: sticky; top: 0; z-index: 10;
    background: var(--grade); color: var(--grade-ink);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .now-inner { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: end; }
  .now-label { font-size: .78rem; font-weight: 700; opacity: .85; }
  .now-name { font-size: 1.25rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .now-time { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
  .now-time small { display: block; font-size: .72rem; font-weight: 700; opacity: .85; line-height: 1.4; text-align: right; }
  .now-bar { grid-column: 1 / -1; height: 5px; background: rgba(255,255,255,.3); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .now-bar i { display: block; height: 100%; background: #fff; width: 0; border-radius: 3px; transition: width 1s linear; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 64px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .school { font-weight: 800; font-size: 1.05rem; }
  .school small { font-weight: 600; color: var(--ink-soft); margin-left: 6px; }
  .today-btn { border: 1.5px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .9rem; }
  .today-btn:hover { border-color: var(--ink); }

  .grades { display: flex; gap: 6px; margin: 16px 0 14px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .grades::-webkit-scrollbar { display: none; }
  .grade { flex: 1 0 auto; min-width: 56px; border: 0; background: transparent; padding: 10px 6px 8px; border-radius: 12px 12px 4px 4px; font-weight: 800; font-size: 1.05rem; color: var(--ink-soft); border-bottom: 4px solid var(--line); }
  .grade span { display: block; font-size: .7rem; font-weight: 600; color: var(--ink-soft); }
  .grade[aria-selected="true"] { color: var(--ink); background: var(--paper); border-bottom-color: var(--gc); }

  .week { display: grid; grid-template-columns: 36px repeat(5, 1fr) 36px; gap: 4px; }
  .nav { border: 0; background: transparent; border-radius: 10px; font-size: 1.3rem; line-height: 1; color: var(--ink-soft); }
  .nav:hover { background: var(--paper); color: var(--ink); }
  .day { border: 1.5px solid transparent; background: transparent; border-radius: 12px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .day .dow { font-size: .72rem; font-weight: 700; color: var(--ink-soft); }
  .day .num { font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
  .day .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; margin-top: 2px; }
  .day.special .dot { background: var(--grade); }
  .day.off .num { color: var(--ink-soft); text-decoration: line-through; }
  .day.today .num { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 3px; text-decoration-color: var(--grade); }
  .day[aria-selected="true"] { background: var(--paper); border-color: var(--grade); }
  .day:hover { border-color: var(--line-strong); }
  .jump { display: flex; justify-content: flex-end; margin-top: 8px; font-size: .85rem; color: var(--ink-soft); }
  .jump input { font: inherit; font-size: .85rem; padding: 4px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }

  .panel { background: var(--paper); border-radius: 18px; margin-top: 16px; overflow: hidden; border: 1.5px solid var(--line); }
  .panel-head { padding: 16px 20px 12px; background: var(--grade-soft); border-bottom: 1.5px solid var(--line); }
  .panel-head h1 { margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; }
  .panel-head .sub { color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
  .note { margin: 10px 0 0; padding: 10px 12px; background: var(--paper); border-left: 4px solid var(--grade); border-radius: 6px; white-space: pre-wrap; }

  .periods { list-style: none; margin: 0; padding: 8px 0; }
  .period { display: grid; grid-template-columns: 7.2em 1fr; gap: 12px; padding: 9px 20px; align-items: baseline; border-left: 4px solid transparent; }
  .period .t { color: var(--ink-soft); font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .period .n { font-weight: 700; }
  .period.past { opacity: .5; }
  .period.live { border-left-color: var(--grade); background: var(--grade-soft); }
  .period.live .t { color: var(--ink); font-weight: 700; }

  .file { padding: 4px 20px 20px; }
  .file-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .link { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .viewer { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .viewer iframe { width: 100%; height: min(70vh, 800px); border: 0; display: block; }
  .viewer img { display: block; margin: 0 auto; }

  .empty { padding: 32px 20px; text-align: center; color: var(--ink-soft); }
  .empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

  .lunch { background: var(--paper); border-radius: 18px; margin-top: 16px; border: 1.5px solid var(--line); padding: 16px 20px 18px; }
  .lunch h2 { margin: 0 0 8px; font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .lunch ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .lunch li { background: var(--bg); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: .95rem; }
  .lunch .none { color: var(--ink-soft); }
  .lunch .month { margin-top: 10px; font-size: .9rem; }

  .foot { margin-top: 24px; font-size: .8rem; color: var(--ink-soft); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 520px) {
    .wrap { padding: 12px 10px 48px; }
    .grade { min-width: 44px; font-size: .95rem; padding: 8px 4px 6px; }
    .grade span { display: none; }
    .day .num { font-size: 1.15rem; }
    .panel-head, .period, .file, .lunch { padding-left: 14px; padding-right: 14px; }
    .period { grid-template-columns: 6.6em 1fr; gap: 8px; }
    .now-time { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<div class="now" id="now">
  <div class="now-inner">
    <div>
      <div class="now-label" id="nowLabel">Right now</div>
      <div class="now-name" id="nowName">Loading…</div>
    </div>
    <div class="now-time" id="nowTime">--:--<small id="nowSub"></small></div>
    <div class="now-bar"><i id="nowBar"></i></div>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <div class="school">Rector Elementary <small>daily schedules</small></div>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>
  <div class="grades" role="tablist" aria-label="Grade" id="grades"></div>
  <div class="week" id="week"></div>
  <div class="jump"><label>Jump to date&nbsp;<input type="date" id="jumpDate"></label></div>

  <section class="panel">
    <div class="panel-head">
      <h1 id="dayTitle">—</h1>
      <div class="sub" id="daySub"></div>
      <div class="note" id="dayNote" hidden></div>
    </div>
    <div id="dayBody"></div>
  </section>

  <section class="lunch">
    <h2>Lunch</h2>
    <div id="lunchBody"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
(() => {
  const GRADES = [
    { id: "K", name: "Kindergarten", color: "var(--gK)" }, { id: "1", name: "1st grade", color: "var(--g1)" },
    { id: "2", name: "2nd grade", color: "var(--g2)" },    { id: "3", name: "3rd grade", color: "var(--g3)" },
    { id: "4", name: "4th grade", color: "var(--g4)" },    { id: "5", name: "5th grade", color: "var(--g5)" },
    { id: "6", name: "6th grade", color: "var(--g6)" },
  ];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // Built-in sample data, used only if the data files can't be loaded.
  const FALLBACK = {"periods":{"K":[{"name":"Arrival & morning work","start":"07:30","end":"07:50"},{"name":"Reading","start":"07:50","end":"09:00"},{"name":"Recess","start":"09:00","end":"09:20"},{"name":"Math","start":"09:20","end":"10:20"},{"name":"Specials","start":"10:20","end":"11:05"},{"name":"Lunch","start":"11:05","end":"11:35"},{"name":"Rest & centers","start":"11:35","end":"12:30"},{"name":"Science / Social studies","start":"12:30","end":"13:30"},{"name":"Writing","start":"13:30","end":"14:15"},{"name":"Pack up & dismissal","start":"14:15","end":"14:30"}],"1":[{"name":"Arrival & morning work","start":"07:30","end":"07:50"},{"name":"Reading","start":"07:50","end":"09:10"},{"name":"Recess","start":"09:10","end":"09:30"},{"name":"Math","start":"09:30","end":"10:30"},{"name":"Specials","start":"10:30","end":"11:15"},{"name":"Lunch","start":"11:15","end":"11:45"},{"name":"Writing","start":"11:45","end":"12:40"},{"name":"Science / Social studies","start":"12:40","end":"13:40"},{"name":"Intervention","start":"13:40","end":"14:15"},{"name":"Pack up & dismissal","start":"14:15","end":"14:30"}],"2":[{"name":"Arrival & morning work","start":"07:30","end":"07:50"},{"name":"Math","start":"07:50","end":"09:00"},{"name":"Specials","start":"09:00","end":"09:45"},{"name":"Reading","start":"09:45","end":"11:00"},{"name":"Recess","start":"11:00","end":"11:20"},{"name":"Lunch","start":"11:25","end":"11:55"},{"name":"Writing","start":"11:55","end":"12:45"},{"name":"Science / Social studies","start":"12:45","end":"13:45"},{"name":"Intervention","start":"13:45","end":"14:15"},{"name":"Pack up & dismissal","start":"14:15","end":"14:30"}],"3":[{"name":"Arrival & morning work","start":"07:30","end":"07:50"},{"name":"Reading","start":"07:50","end":"09:15"},{"name":"Math","start":"09:15","end":"10:30"},{"name":"Recess","start":"10:30","end":"10:50"},{"name":"Specials","start":"10:50","end":"11:35"},{"name":"Lunch","start":"11:35","end":"12:05"},{"name":"Writing","start":"12:05","end":"12:55"},{"name":"Science / Social studies","start":"12:55","end":"13:50"},{"name":"Intervention","start":"13:50","end":"14:15"},{"name":"Pack up & dismissal","start":"14:15","end":"14:30"}],"4":[{"name":"Arrival & morning work","start":"07:30","end":"07:50"},{"name":"Math","start":"07:50","end":"09:15"},{"name":"Reading","start":"09:15","end":"10:40"},{"name":"Recess","start":"10:40","end":"11:00"},{"name":"Science / Social studies","start":"11:00","end":"11:45"},{"name":"Lunch","start":"11:45","end":"12:15"},{"name":"Specials","start":"12:15","end":"13:00"},{"name":"Writing","start":"13:00","end":"13:50"},{"name":"Intervention","start":"13:50","end":"14:15"},{"name":"Pack up & dismissal","start":"14:15","end":"14:30"}],"5":[{"name":"Arrival & morning work","start":"07:30","end":"07:50"},{"name":"Reading","start":"07:50","end":"09:15"},{"name":"Science / Social studies","start":"09:15","end":"10:10"},{"name":"Math","start":"10:10","end":"11:25"},{"name":"Recess","start":"11:25","end":"11:45"},{"name":"Lunch","start":"11:55","end":"12:25"},{"name":"Specials","start":"12:25","end":"13:10"},{"name":"Writing","start":"13:10","end":"13:55"},{"name":"Intervention","start":"13:55","end":"14:15"},{"name":"Pack up & dismissal","start":"14:15","end":"14:30"}],"6":[{"name":"Arrival & morning work","start":"07:30","end":"07:50"},{"name":"Math","start":"07:50","end":"09:15"},{"name":"Science / Social studies","start":"09:15","end":"10:10"},{"name":"Reading","start":"10:10","end":"11:25"},{"name":"Recess","start":"11:25","end":"11:45"},{"name":"Lunch","start":"12:05","end":"12:35"},{"name":"Specials","start":"12:35","end":"13:20"},{"name":"Writing","start":"13:20","end":"13:55"},{"name":"Intervention","start":"13:55","end":"14:15"},{"name":"Pack up & dismissal","start":"14:15","end":"14:30"}]},"days":{"2026-10-12":{"all":{"noSchool":true,"note":"Teacher Work Day — no school for students"}}},"lunch":{"2026-10-01":["Taco Salad","Chicken Fajita (HS)","Pinto Beans","Shredded Lettuce, Tomato, Shredded Cheese","Pineapple Tidbits"],"2026-10-02":["Cheeseburger","French Fries","Salad Sandwich Cup","Diced Peaches"],"2026-10-05":["Mini Corn Dogs","Baked Beans","Cole Slaw","Banana"],"2026-10-06":["Breaded Beef Patty/Gravy","Mashed Potatoes","Green Beans","Roll","Mixed Fruit"],"2026-10-07":["Pepperoni Pizza","Salad/Ranch","Seasoned Corn","Mandarin Oranges"],"2026-10-08":["Burrito, Beef & Beans w/ Chili & Cheese","Goldfish Crackers","Salad/Ranch","Steamed Carrots/Apple Slices"],"2026-10-09":["Cheeseburger","French Fries","Salad Sandwich Cup","Diced Peaches"],"2026-10-13":["Breaded Beef Patty/Gravy","Mashed Potatoes","Green Beans","Roll","Mixed Fruit"],"2026-10-14":["Mozzarella Cheese Bites/Marinara Sauce","Salad/Ranch","Seasoned Corn","Mandarin Oranges"],"2026-10-15":["Nachos w/ Beef","Tortilla Chips/Cheese Cup","Salad/Ranch","Pinto Beans","Pineapple Tidbits"],"2026-10-16":["Cheeseburger","French Fries","Salad Sandwich Cup","Diced Peaches"],"2026-10-19":["Vegetable Beef Soup","Crackers","Grilled Cheese Sandwich","Salad/Ranch","Bananas"],"2026-10-20":["Breaded Beef Patty/Gravy","Mashed Potatoes","Green Beans","Roll","Mixed Fruit"],"2026-10-21":["Chicken & Noodles","Roll","Steamed Broccoli","Steamed Carrots","Apple Slices"],"2026-10-22":["Mini Corn Dogs","Baked Beans","Cole Slaw","Frozen Fruit Cup"],"2026-10-23":["Cheeseburger","French Fries","Salad Sandwich Cup","Diced Peaches"],"2026-10-26":["Fish Sticks","Cornbread","Macaroni & Cheese","Peas & Carrots","Diced Pears"],"2026-10-27":["Breaded Beef Patty/Gravy","Mashed Potatoes","Green Beans","Roll","Mixed Fruit"],"2026-10-28":["Pepperoni Pizza","Salad/Ranch","Seasoned Corn","Mandarin Oranges"],"2026-10-29":["Chili w/ Beef & Beans","Cheese Stick/Goldfish Crackers","Celery & Carrot Sticks","Cinnamon Roll/Apple Slices"],"2026-10-30":["Cheeseburger","French Fries","Salad Sandwich Cup","Diced Peaches"]}};

  let periods = {}, days = {}, lunch = {};
  let grade = "2", selected = toISO(new Date()), tick = null, dataNote = "";
  try { const g = localStorage.getItem("rector.grade"); if (GRADES.some(x => x.id === g)) grade = g; } catch {}

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function toISO(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function fromISO(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
  function addDays(s, n) { const d = fromISO(s); d.setDate(d.getDate()+n); return toISO(d); }
  function mondayOf(s) { const d = fromISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); }
  const gradeInfo = () => GRADES.find(g => g.id === grade);
  function mins(hhmm) { const [h, m] = String(hhmm).split(":").map(Number); return h * 60 + (m || 0); }
  function fmt(hhmm) { const t = mins(hhmm); const h = Math.floor(t/60), m = t % 60; return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2,"0") + (h < 12 ? " am" : " pm"); }
  function isWeekend(date) { const w = fromISO(date).getDay(); return w === 0 || w === 6; }

  // Resolve what a given grade does on a given date.
  function dayFor(g, date) {
    const d = days[date] || {};
    const o = Object.assign({}, d.all || {}, d[g] || {});
    const list = o.periods || periods[g] || [];
    const noSchool = !!o.noSchool || isWeekend(date);
    return { periods: noSchool ? [] : list.slice().sort((a, b) => mins(a.start) - mins(b.start)), note: o.note || "", file: o.file || "", noSchool, special: !!(d.all || d[g]) };
  }

  // ---------- countdown bar ----------
  function updateNow() {
    const nowD = new Date();
    const today = toISO(nowD);
    const cur = nowD.getHours() * 60 + nowD.getMinutes() + nowD.getSeconds() / 60;
    const info = dayFor(grade, today);
    const g = gradeInfo();
    let label = g.name + " · right now", name = "", time = "", sub = "", pct = 0;

    const live = info.periods.find(p => cur >= mins(p.start) && cur < mins(p.end));
    const next = info.periods.find(p => mins(p.start) > cur);
    if (live) {
      const left = mins(live.end) - cur;
      name = live.name;
      time = countdown(left); sub = "left · ends " + fmt(live.end);
      pct = (cur - mins(live.start)) / (mins(live.end) - mins(live.start)) * 100;
    } else if (next) {
      const until = mins(next.start) - cur;
      label = g.name + " · up next";
      name = next.name;
      time = countdown(until); sub = "until " + fmt(next.start);
    } else {
      // find next school day for this grade
      let d = today, n = 0, found = null;
      while (n++ < 30) { d = addDays(d, 1); const f = dayFor(grade, d); if (f.periods.length) { found = { d, p: f.periods[0] }; break; } }
      label = info.noSchool ? "No school today" : "School day is over";
      if (info.note && info.noSchool) label += " · " + info.note;
      name = found ? "Next: " + FULL[fromISO(found.d).getDay()] + " at " + fmt(found.p.start) : "No upcoming school days posted";
      time = nowD.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); sub = "";
    }
    $("nowLabel").textContent = label;
    $("nowName").textContent = name;
    $("nowTime").firstChild.textContent = time;
    $("nowSub").textContent = sub;
    $("nowBar").style.width = Math.max(0, Math.min(100, pct)) + "%";
    // keep the "live" highlight in the list current when viewing today
    if (selected === today) highlightLive(cur);
  }
  function countdown(m) {
    const total = Math.max(0, Math.round(m * 60));
    const h = Math.floor(total / 3600), mm = Math.floor((total % 3600) / 60), ss = total % 60;
    return h ? h + ":" + String(mm).padStart(2,"0") + ":" + String(ss).padStart(2,"0") : mm + ":" + String(ss).padStart(2,"0");
  }
  function highlightLive(cur) {
    document.querySelectorAll(".period").forEach(el => {
      const s = Number(el.dataset.s), e = Number(el.dataset.e);
      el.classList.toggle("live", cur >= s && cur < e);
      el.classList.toggle("past", cur >= e);
    });
  }

  // ---------- rendering ----------
  function renderGrades() {
    const el = $("grades"); el.innerHTML = "";
    for (const g of GRADES) {
      const b = document.createElement("button");
      b.className = "grade"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", g.id === grade);
      b.style.setProperty("--gc", g.color);
      b.innerHTML = esc(g.id) + "<span>" + esc(g.name) + "</span>";
      b.addEventListener("click", () => { grade = g.id; try { localStorage.setItem("rector.grade", g.id); } catch {} renderAll(); });
      el.appendChild(b);
    }
    document.documentElement.style.setProperty("--grade", gradeInfo().color);
    document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--grade").trim() || "#3B7FD1";
  }
  function renderWeek() {
    const el = $("week"); el.innerHTML = "";
    const mon = mondayOf(selected), today = toISO(new Date());
    const mk = (cls, txt, aria, fn) => { const b = document.createElement("button"); b.className = cls; b.textContent = txt; b.setAttribute("aria-label", aria); b.addEventListener("click", fn); return b; };
    el.appendChild(mk("nav", "‹", "Previous week", () => selectDate(addDays(selected, -7))));
    for (let i = 0; i < 5; i++) {
      const date = addDays(mon, i), d = fromISO(date), info = dayFor(grade, date);
      const b = document.createElement("button");
      b.className = "day" + (info.special ? " special" : "") + (info.noSchool ? " off" : "") + (date === today ? " today" : "");
      b.setAttribute("aria-selected", date === selected);
      b.innerHTML = '<span class="dow">' + DOW[d.getDay()] + '</span><span class="num">' + d.getDate() + '</span><span class="dot"></span>';
      b.addEventListener("click", () => selectDate(date));
      el.appendChild(b);
    }
    el.appendChild(mk("nav", "›", "Next week", () => selectDate(addDays(selected, 7))));
    $("jumpDate").value = selected;
  }
  function renderDay() {
    const d = fromISO(selected), g = gradeInfo(), info = dayFor(grade, selected);
    $("dayTitle").textContent = FULL[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
    $("daySub").textContent = g.name + (selected === toISO(new Date()) ? " · today" : "");
    const noteEl = $("dayNote"); noteEl.hidden = !info.note; noteEl.textContent = info.note;
    let html = "";
    if (info.noSchool) {
      html += '<div class="empty"><strong>No school</strong>' + (isWeekend(selected) ? "Pick a weekday to see a schedule." : "") + '</div>';
    } else if (!info.periods.length) {
      html += '<div class="empty"><strong>No schedule posted for ' + esc(g.name) + '</strong>Check back later, or ask the office.</div>';
    } else {
      html += '<ul class="periods">' + info.periods.map(p =>
        '<li class="period" data-s="' + mins(p.start) + '" data-e="' + mins(p.end) + '"><span class="t">' + fmt(p.start).replace(/ [ap]m/, "") + '–' + fmt(p.end) + '</span><span class="n">' + esc(p.name) + '</span></li>').join("") + '</ul>';
    }
    if (info.file) {
      const isPdf = /\.pdf(\?|$)/i.test(info.file);
      html += '<div class="file"><div class="file-bar"><strong>Posted schedule</strong><a class="link" href="' + esc(info.file) + '" target="_blank" rel="noopener">Open full size</a></div><div class="viewer">' +
        (isPdf ? '<iframe src="' + esc(info.file) + '#toolbar=0&view=FitH" title="Posted schedule"></iframe>' : '<img src="' + esc(info.file) + '" alt="Posted schedule">') + '</div></div>';
    }
    $("dayBody").innerHTML = html;
    if (selected === toISO(new Date())) { const n = new Date(); highlightLive(n.getHours()*60 + n.getMinutes() + n.getSeconds()/60); }
  }
  function renderLunch() {
    const items = lunch[selected];
    const month = lunch[selected.slice(0, 7)];
    let html = "";
    if (Array.isArray(items) && items.length) html += "<ul>" + items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>";
    else if (isWeekend(selected) || dayFor(grade, selected).noSchool) html += '<div class="none">No lunch served.</div>';
    else html += '<div class="none">Menu for this day hasn’t been posted yet.</div>';
    if (month && month.file) html += '<div class="month"><a class="link" href="' + esc(month.file) + '" target="_blank" rel="noopener">Open ' + MONTHS[Number(selected.slice(5,7)) - 1] + ' menu</a></div>';
    $("lunchBody").innerHTML = html;
  }
  function renderAll() { renderGrades(); renderWeek(); renderDay(); renderLunch(); updateNow(); $("foot").textContent = dataNote; }
  function selectDate(date) { selected = date; renderWeek(); renderDay(); renderLunch(); }

  $("todayBtn").addEventListener("click", () => selectDate(toISO(new Date())));
  $("jumpDate").addEventListener("change", e => { if (e.target.value) selectDate(e.target.value); });
  document.addEventListener("keydown", e => {
    if (e.target.matches("input,textarea")) return;
    if (e.key === "ArrowLeft") selectDate(addDays(selected, -1));
    if (e.key === "ArrowRight") selectDate(addDays(selected, 1));
  });

  // ---------- data ----------
  async function loadJSON(name) {
    const r = await fetch("data/" + name + ".json?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(name + " " + r.status);
    return r.json();
  }
  async function load() {
    try {
      [periods, days, lunch] = await Promise.all([loadJSON("periods"), loadJSON("days"), loadJSON("lunch")]);
      dataNote = "";
    } catch (e) {
      periods = FALLBACK.periods || {}; days = FALLBACK.days || {}; lunch = FALLBACK.lunch || {};
      dataNote = "Showing sample data — the schedule files couldn’t be loaded.";
    }
    for (const o of [periods, days, lunch]) delete o._help;
    renderAll();
  }

  renderAll();
  load();
  clearInterval(tick); tick = setInterval(updateNow, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(); } });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
