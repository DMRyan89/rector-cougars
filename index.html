<style>
  :root{
    --blue:#1B3FA0; --navy:#0F2460; --sky:#DCE5FA; --paper:#F7F8FC; --ink:#141A2E;
    --mute:#6B7390; --line:#DDE1EC; --red:#C8102E; --gold:#E7B10A; --green:#1E8E4B;
    --sans:"Barlow",system-ui,sans-serif; --cond:"Barlow Condensed",var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;
       padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  header{background:var(--blue);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
         display:flex;align-items:baseline;justify-content:space-between}
  header .brand{display:flex;align-items:center;gap:10px}
  header img{width:34px;height:34px}
  header h1{font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.01em}
  header span{font-size:13px;opacity:.85}
  main{max-width:520px;margin:0 auto;padding:0 16px}
  .view{display:none}.view.on{display:block}

  /* hero */
  .hero{background:var(--navy);color:#fff;margin:0 -16px;padding:28px 24px 30px;
        border-radius:0 0 28px 28px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
               background:var(--blue);opacity:.45}
  .hero .label{font-size:15px;color:#BFD0FF;font-weight:500}
  .hero .big{font-family:var(--cond);font-weight:800;font-size:64px;line-height:1;margin:6px 0 2px;letter-spacing:-.01em}
  .hero .sub{font-size:16px;color:#BFD0FF}
  .hero .sub b{color:#fff;font-weight:600}
  .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:18px;overflow:hidden;position:relative;z-index:1}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width 1s linear}

  /* schedule list */
  .sched{margin-top:18px}
  .row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:12px 10px;
       border-radius:12px;border-bottom:1px solid var(--line)}
  .row.now{background:var(--sky);border-bottom-color:transparent;font-weight:600}
  .row.done{color:var(--mute)}
  .row .num{font-family:var(--cond);font-weight:700;font-size:22px;color:var(--blue)}
  .row.done .num{color:var(--mute)}
  .row .time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute)}
  .row.now .time{color:var(--ink)}
  .row.note{grid-template-columns:1fr;text-align:center;font-size:13px;color:var(--mute);background:#FFF7DB;
            border-radius:10px;border-bottom:0;padding:8px}

  /* calendar */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
  .stat .n{font-family:var(--cond);font-weight:800;font-size:44px;line-height:1;color:var(--blue)}
  .stat .l{font-size:14px;color:var(--mute);margin-top:4px}
  h2{font-family:var(--cond);font-weight:700;font-size:20px;margin:26px 0 8px;color:var(--navy)}
  .ev{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);align-items:center}
  .ev .d{font-family:var(--cond);text-align:center;line-height:1.05}
  .ev .d b{display:block;font-size:24px;font-weight:800}
  .ev .d small{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em}
  .ev .t{font-weight:500}
  .ev .t small{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-top:2px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .past{opacity:.45}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
  .chips button{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;color:var(--mute)}
  .chips button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .toggle{margin:14px 0 4px;display:flex;justify-content:flex-end}
  .toggle button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;color:var(--mute)}

  /* lunch */
  .lunch{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .lunch h3{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--navy);margin-bottom:6px}
  .lunch ul{list-style:none;font-size:14px;line-height:1.45}
  .lunch li:first-child{font-weight:600}
  .lunch .none{grid-column:1/-1;color:var(--mute);font-size:14px}
  .mday{padding:12px 6px;border-bottom:1px solid var(--line)}
  .mday .d{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--blue);margin-bottom:4px}
  .mday.today .d{color:var(--red)}
  .mday .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px;line-height:1.4}
  .mday .cols b{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:2px}

  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;
      padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;padding:12px 0 10px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer}
  nav button.on{color:var(--blue);font-weight:600}
  nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  nav button:first-child{}
  nav svg{display:block;margin:0 auto 3px;width:22px;height:22px}
  footer{text-align:center;font-size:12px;color:var(--mute);padding:26px 0 6px}
</style>
</head>

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const fmt12 = t => { let [h,m] = t.split(":").map(Number); const ap = h>=12?"pm":"am"; h = h%12||12; return `${h}:${pad(m)}`; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const dayDiff = (a,b) => Math.round((parse(key(b))-parse(key(a)))/864e5);

function noSchool(d){
  const k = key(d);
  if (d.getDay()===0||d.getDay()===6) return "Weekend";
  if (k<FIRST_DAY) return "Summer break";
  if (k>LAST_DAY) return "Summer break";
  for (const x of NO_SCHOOL){ if (k>=x.s && k<=(x.e||x.s)) return x.t; }
  return null;
}
function nextSchoolDay(d){ const n = new Date(d); n.setHours(12); do{ n.setDate(n.getDate()+1);}while(noSchool(n)); return n; }
function schoolDaysLeft(d){ let c=0; const n=new Date(d); n.setHours(12); const end=parse(LAST_DAY); while(n<=end){ if(!noSchool(n)) c++; n.setDate(n.getDate()+1);} return c; }

function renderSchedule(nowMin, isSchoolDay){
  $("#sched").innerHTML = PERIODS.map(p=>{
    const s=mins(p.s), e=mins(p.e);
    let cls = "row";
    if (isSchoolDay){ if (nowMin>=s && nowMin<e) cls+=" now"; else if (nowMin>=e) cls+=" done"; }
    const label = p.name || `Period ${p.n}`;
    return `<div class="${cls}"><div class="num">${p.n}</div><div>${label}</div><div class="time">${fmt12(p.s)}–${fmt12(p.e)}</div></div>`;
  }).join("");
}

function tick(){
  const now = new Date();
  $("#hdate").textContent = `${DOW[now.getDay()].slice(0,3)}, ${MON[now.getMonth()]} ${now.getDate()}`;
  const reason = noSchool(now);
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const L=$("#h-label"), B=$("#h-big"), S=$("#h-sub"), bar=$("#h-bar i");
  const remain = m => { const t=Math.max(0,m-nowMin); const mm=Math.floor(t), ss=Math.floor((t-mm)*60); return `${mm}:${pad(ss)}`; };

  if (reason){
    const nx = nextSchoolDay(now);
    L.textContent = "No school today";
    B.textContent = reason;
    S.innerHTML = `Back <b>${DOW[nx.getDay()]}, ${MON[nx.getMonth()]} ${nx.getDate()}</b>`;
    bar.style.width="0";
    renderSchedule(nowMin,false); return;
  }
  const first = mins(PERIODS[0].s), last = mins(PERIODS[PERIODS.length-1].e);
  if (nowMin < first){
    L.textContent = "Good morning"; B.textContent = "School starts";
    S.innerHTML = `in <b>${remain(first)}</b> · 1st period at ${fmt12(PERIODS[0].s)}`; bar.style.width="0";
  } else if (nowMin >= last){
    L.textContent = "That's a wrap"; B.textContent = "School's out";
    const nx = nextSchoolDay(now);
    S.innerHTML = `Next school day: <b>${DOW[nx.getDay()]}</b>`; bar.style.width="100%";
  } else {
    let cur = PERIODS.find(p=>nowMin>=mins(p.s)&&nowMin<mins(p.e));
    if (cur){
      const s=mins(cur.s), e=mins(cur.e);
      L.textContent = `Right now · ${fmt12(cur.s)}–${fmt12(cur.e)}`;
      B.textContent = cur.name || `${cur.n} period`;
      S.innerHTML = `Bell rings in <b>${remain(e)}</b>`;
      bar.style.width = ((nowMin-s)/(e-s)*100).toFixed(1)+"%";
    } else {
      const nx = PERIODS.find(p=>mins(p.s)>nowMin);
      L.textContent = "Passing period"; B.textContent = "Get moving";
      S.innerHTML = `${nx.name||nx.n+" period"} starts in <b>${remain(mins(nx.s))}</b>`; bar.style.width="100%";
    }
  }
  renderSchedule(nowMin,true);
}

function renderLunch(){
  const now=new Date(), k=key(now);
  const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  const t=MENUS[k];
  $("#lunch-today").innerHTML = t
    ? `<div><h3>Main lunch</h3>${li(t.main)}</div><div><h3>Grab &amp; Go</h3>${li(t.grab)}</div>`
    : `<div class="none">${noSchool(now)?"No lunch today — no school.":"No menu posted for today yet."}</div>`;
  const days=Object.keys(MENUS).sort(); if(!days.length) return;
  const m=parse(days[0]); $("#lunch-title").textContent=`${["January","February","March","April","May","June","July","August","September","October","November","December"][m.getMonth()]} lunch menu`;
  $("#menu-list").innerHTML = days.map(d=>{const x=parse(d), v=MENUS[d];
    return `<div class="mday ${d===k?'today':''} ${d<k?'past':''}"><div class="d">${DOW[x.getDay()]}, ${MON[x.getMonth()]} ${x.getDate()}</div><div class="cols"><div><b>Main</b>${v.main.join("<br>")}</div><div><b>Grab &amp; Go</b>${v.grab.join("<br>")}</div></div></div>`;}).join("");
}

function renderCalendar(){
  const now = new Date(); const k = key(now);
  // next break = next multi-day holiday or summer
  const breaks = NO_SCHOOL.filter(x=>x.k==="hol"&&x.e).map(x=>({s:x.s,t:x.t}));
  breaks.push({s:"2027-05-22", t:"Summer"});
  const nb = breaks.find(b=>b.s>k);
  if (nb){ $("#s-break").textContent = dayDiff(now, parse(nb.s)); $("#s-break-l").textContent = `days until ${nb.t}`; }
  $("#s-left").textContent = k>LAST_DAY ? 0 : schoolDaysLeft(now);

  $("#quarters").innerHTML = QUARTERS.map(q=>{
    const a=parse(q.s), b=parse(q.e); const on = k>=q.s&&k<=q.e;
    return `<div class="ev ${k>q.e?'past':''}"><div class="d"><b>${on?'Now':'Q'+q.n[0]}</b></div><div class="t">${q.n}<small>${MON[a.getMonth()]} ${a.getDate()} – ${MON[b.getMonth()]} ${b.getDate()}</small></div></div>`;
  }).join("");

  const all = [...EVENTS, ...NO_SCHOOL.map(x=>({d:x.s, t:x.t, k:x.k, sub:x.e?`No school ${MON[parse(x.s).getMonth()]} ${parse(x.s).getDate()}–${parse(x.e).getDate()}`:"No school"}))]
    .sort((a,b)=>a.d.localeCompare(b.d));
  let showPast=false, filt="all";
  const inFilt = e => filt==="all" || (filt==="sport"&&e.k==="sport") || (filt==="career"&&e.k==="career") || (filt==="school"&&!["sport","career"].includes(e.k));
  document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{filt=b.dataset.f; document.querySelectorAll("#chips button").forEach(x=>x.classList.toggle("on",x===b)); draw();});
  const draw = () => {
    $("#events").innerHTML = all.filter(e=>(showPast||e.d>=k)&&inFilt(e)).map(e=>{
      const d=parse(e.d);
      return `<div class="ev ${e.d<k?'past':''}"><div class="d"><b>${d.getDate()}</b><small>${MON[d.getMonth()].toUpperCase()}</small></div><div class="t"><span class="dot" style="background:${COLORS[e.k]}"></span>${e.t}${e.sub?`<small>${e.sub}</small>`:""}</div></div>`;
    }).join("") || `<div class="ev"><div></div><div class="t">Nothing left on the calendar — see you next year.</div></div>`;
    $("#showpast").textContent = showPast?"Hide past events":"Show past events";
  };
  $("#showpast").onclick = ()=>{showPast=!showPast; draw();};
  draw();
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===b.dataset.v));
  window.scrollTo(0,0);
  if(b.dataset.v==="lunch"){const t=document.querySelector(".mday.today")||document.querySelector(".mday:not(.past)"); if(t) t.scrollIntoView({block:"start"});}
});

tick(); setInterval(tick,1000); renderCalendar(); renderLunch();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
